name: Database Backup

on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC
  workflow_dispatch:       # Manual trigger via GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PGPASSWORD: ${{ secrets.RENDER_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify database URL secret
        run: |
          if [ -z "${{ secrets.RENDER_DB_EXTERNAL_URL }}" ]; then
            echo "::error::RENDER_DB_EXTERNAL_URL secret is not set"
            exit 1
          fi
          echo "Secret configured for $(echo '${{ secrets.RENDER_DB_EXTERNAL_URL }}' | sed 's|.*@||' | sed 's|/.*||')"

      - name: Create backup directory
        run: mkdir -p backup

      - name: Dump (custom format — pg_restore)
        run: |
          pg_dump \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backup/harisree_render_$(date +%Y%m%d).pgdump" \
            "${{ secrets.RENDER_DB_EXTERNAL_URL }}"

      - name: Dump (plain SQL — readable)
        run: |
          pg_dump \
            --no-owner \
            --no-privileges \
            --file="backup/harisree_render_$(date +%Y%m%d).sql" \
            "${{ secrets.RENDER_DB_EXTERNAL_URL }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harisree-db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
