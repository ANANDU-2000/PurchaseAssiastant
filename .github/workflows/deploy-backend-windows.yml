name: Deploy backend (Windows server)

# Production backend deploy to the company Windows Server through a self-hosted runner.
#
# SECURITY MODEL (read before enabling) - see deploy/windows/README.md "Security model":
#  * MANUAL ONLY (workflow_dispatch). It deliberately does NOT run on push to main: anyone with write access
#    could otherwise ship code to the production server just by pushing. It must also never run on
#    pull_request, because a self-hosted runner executes the code it is given with the runner account's rights.
#  * Only runs from `main`, only for actors listed in repository variable DEPLOY_ALLOWED_ACTORS
#    (JSON array, e.g. ["ANANDU-2000"]), and only after repository variable ENABLE_WINDOWS_DEPLOY=true.
#    With either variable unset the job is skipped.
#  * Uses its OWN environment `windows-production` (not `Production`, which Vercel already uses and has no
#    protection rules). Add "Required reviewers" to it where your GitHub plan allows (private repositories need
#    GitHub Pro/Team for that).
#  * Keep the repository PRIVATE (public repo + self-hosted runner invites hostile pull requests).
#  * Actions are pinned to commit SHAs (the runner executes them with high privilege).
#  * Register the runner with labels: self-hosted, windows, hexa-prod.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexa-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Windows server
    if: >-
      ${{ vars.ENABLE_WINDOWS_DEPLOY == 'true'
      && github.ref == 'refs/heads/main'
      && contains(fromJSON(vars.DEPLOY_ALLOWED_ACTORS || '[]'), github.actor) }}
    runs-on: [self-hosted, windows, hexa-prod]
    environment: windows-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Deploy release (backup, migrate, switch, health check, auto-rollback)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\windows\deploy-release.ps1" -SourceDir "$env:GITHUB_WORKSPACE" -Sha "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  public-smoke:
    name: Public smoke test (through Cloudflare)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health via public hostname
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}   # repository variable, e.g. https://api.harisreeagency.online
        run: |
          test -n "$API_URL" || { echo "Set repository variable PUBLIC_API_URL"; exit 1; }
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_URL/health/ready" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Public health check failed"; exit 1
