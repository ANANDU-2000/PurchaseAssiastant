name: Render Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes
  workflow_dispatch:          # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /health/ready
        run: |
          URL="https://harisree-api.onrender.com/health/ready"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "Health check: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::warning::Unexpected status $STATUS from $URL"
          fi
