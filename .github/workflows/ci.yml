# Phased recovery — Phase 7: CI smoke (analyze, unit tests, backend pytest)
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-dead-api-hosts:
    name: Assert no dead Render API hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid onrender production hosts outside archive/
        run: bash scripts/assert-no-dead-api-hosts.sh

  flutter-ssot:
    name: Flutter SSOT smoke (money + reports + classifier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: SSOT regression tests
        run: flutter test test/trade_purchase_line_money_contract_test.dart test/trade_report_aggregate_test.dart test/smart_unit_classifier_test.dart test/purchase_draft_calc_test.dart test/calc_line_freight_parity_test.dart test/calc_header_parity_test.dart

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic migrations (SQLite smoke)
        env:
          HEXA_USE_SQLITE: "1"
        run: alembic upgrade head
      - name: Test
        run: python -m pytest -q

  # The SQLite job above cannot run the PostgreSQL-only migrations (they return early on SQLite) and
  # does not enforce foreign keys / partial unique indexes. This job applies EVERY migration to an empty
  # PostgreSQL database and runs the same test suite against it.
  backend-postgres:
    name: Backend on PostgreSQL (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexa -d hexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://hexa:hexa@localhost:5432/hexa
      HEXA_TEST_DATABASE_URL: postgresql+asyncpg://hexa:hexa@localhost:5432/hexa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head (real PostgreSQL, empty database)
        run: alembic upgrade head
      - name: Alembic is at a single head
        run: test "$(alembic heads | grep -c '(head)')" = "1"
      - name: Test (PostgreSQL)
        run: python -m pytest -q

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      # Optional stricter gate (not enforced): ripgrep `\blineMoney\b` under lib with an allowlist
      # for display-only paths, if you want CI to catch new client-side money calculations.
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Goldens are stored per OS (test/golden/goldens/<os>/); on a mismatch the diff images land here.
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: flutter_app/test/golden/failures
          if-no-files-found: ignore

  flutter-web:
    name: Flutter web release build (Vercel parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build web (Vercel parity)
        env:
          BUILD_MAX_WORKERS_PER_TASK: "1"
          DART_VM_OPTIONS: "--max-old-space-size=3072"
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter clean
          flutter pub get
          flutter build web --release \
            -O2 \
            --no-web-resources-cdn \
            --no-source-maps \
            --no-wasm-dry-run \
            --dart-define=API_BASE_URL=https://my-purchases-api.onrender.com \
            --dart-define=GOOGLE_OAUTH_CLIENT_ID=
